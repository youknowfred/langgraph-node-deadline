name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run tests (deprecations are errors)
        run: pytest -q -W error::DeprecationWarning -W error::PendingDeprecationWarning
      - name: Run the demos
        run: |
          python examples/salvage_demo.py
          python examples/hourglass_demo.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[lint]"
      - name: Ruff
        run: ruff check src tests examples bench
      - name: Mypy (strict, public surface)
        run: mypy --strict src/langgraph_node_deadline
      - name: Pyright
        run: pyright src/langgraph_node_deadline
      - name: Vermin (3.9 floor holds even with annotations evaluated)
        run: vermin --target=3.9- --eval-annotations --violations src

  integration:
    # Proves the salvage claim against a real LangGraph StateGraph. Separate from
    # the matrix so the core stays dependency-light; the test is importorskip-
    # guarded and skips wherever langgraph is absent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install (with langgraph)
        run: python -m pip install --upgrade pip && pip install -e ".[dev,langgraph]"
      - name: Run integration tests against real LangGraph
        run: pytest -q tests/test_langgraph_integration.py
