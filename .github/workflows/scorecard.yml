name: Scorecard supply-chain security

# OpenSSF Scorecard — automated supply-chain security scoring. Runs weekly, on
# pushes to main, and whenever a branch-protection rule changes, then uploads the
# SARIF result to the Security tab and (publish_results) to the public Scorecard
# API that backs the README badge.
#
# Every action is pinned to a full commit SHA (with a # vX.Y.Z comment), matching
# the repo convention in ci.yml / release.yml; Dependabot keeps the pins fresh.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  push:
    branches: [main]
  branch_protection_rule: {}

# Least privilege at the top; the analysis job widens only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF result to code scanning
      id-token: write # OIDC token so publish_results can attest the run
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.36.2
        with:
          sarif_file: results.sarif
