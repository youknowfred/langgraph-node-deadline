name: Release

# Publish to PyPI via Trusted Publishing (OIDC) — no long-lived token lives in
# the repo or in ~/.pypirc. Triggered by pushing a version tag, e.g. `v0.2.0`.
#
# One-time setup on PyPI (see docs/RELEASING.md):
#   PyPI → the project → Settings → Publishing → Add a GitHub Actions publisher
#     owner: youknowfred
#     repository: langgraph-node-deadline
#     workflow: release.yml
#     environment: pypi
# Then create a GitHub Environment named `pypi` (optionally with required
# reviewers) so a release needs an explicit approval click.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Guard against stale / multiple artifacts
        run: |
          test "$(ls dist/*.whl | wc -l)" -eq 1
          test "$(ls dist/*.tar.gz | wc -l)" -eq 1
      - name: Smoke-test the built wheel in a clean env
        # Installs the actual WHEEL (not the source tree) and asserts the public API
        # imports and the version matches the tag — catches a mis-packaged artifact
        # that the in-tree tests can't (they run against src/ on sys.path).
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --no-cache-dir dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          import os
          import langgraph_node_deadline as m
          assert m.__all__, "empty __all__"
          for name in m.__all__:
              assert hasattr(m, name), f"missing public symbol: {name}"
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          assert m.__version__ == tag, f"version {m.__version__} != tag {tag}"
          print("wheel smoke test OK:", m.__version__)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # Re-validate the downloaded artifact before the immutable upload (belt-and-suspenders).
      - name: Re-check artifact integrity
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
          test "$(ls dist/*.whl | wc -l)" -eq 1
          test "$(ls dist/*.tar.gz | wc -l)" -eq 1
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        # v1.11+ emits PEP 740 build attestations by default (Trusted Publishing).
