[build-system]
# hatchling >= 1.27 is required to emit PEP 639 SPDX license metadata
# (Metadata-Version 2.4 / License-Expression). Older backends silently downgrade
# to free-text License or hard-fail in non-isolated builds, so pin the floor.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "langgraph-node-deadline"
version = "0.2.0"
description = "One binding deadline for every inner timeout in a LangGraph node — clamp inner budgets to the cooperative deadline so work salvages instead of getting killed by the watchdog."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fred Becker" }]
keywords = [
    "langgraph",
    "langchain",
    "asyncio",
    "timeout",
    "deadline",
    "cancellation",
    "agents",
    "llm",
    "reliability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Test-only; never installed at runtime (the core stays zero-dependency).
dev = ["pytest>=7", "pytest-asyncio>=0.23"]
# Static-analysis gate run in CI. Optional; not needed to use the package.
lint = ["mypy>=1.10", "ruff>=0.5", "vermin>=1.6", "pyright>=1.1.350"]
# Real-LangGraph integration test only. Optional; NEVER a runtime dependency —
# the core is and stays stdlib-only. tests/test_langgraph_integration.py is
# importorskip-guarded, so the suite runs fine without it.
langgraph = ["langgraph>=0.2"]

[project.urls]
Homepage = "https://github.com/youknowfred/langgraph-node-deadline"
Issues = "https://github.com/youknowfred/langgraph-node-deadline/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_node_deadline"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
